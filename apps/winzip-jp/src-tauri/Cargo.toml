[package]
name = "winzip-jp"
version = "0.1.0"
description = "日本語版 Windows 向け ZIP を作る Mac アプリ"
authors = ["winzip-jp"]
edition = "2021"
license.workspace = true
publish.workspace = true

[lib]
name = "winzip_jp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zipcore = { path = "../../../crates/zipcore" }
