name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  store-copy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check store listing, pages, and screenshot sizes
        run: node docs/store/check-listing.mjs

  zipcore:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Test zipcore
        run: cargo test -p zipcore --all-features

  windows-oracle:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install 7-Zip
        run: choco install 7zip -y
      - name: Parse windows-extract.ps1 (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $path = Join-Path $env:GITHUB_WORKSPACE "tests\oracles\windows-extract.ps1"
          $errs = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$null, [ref]$errs)
          if ($errs -and $errs.Count -gt 0) {
            $errs | ForEach-Object { Write-Host $_.ToString() }
            throw "windows-extract.ps1 parse failed"
          }
          Write-Host "windows-extract.ps1 parsed OK"
      - name: Golden ZIP + 7-Zip CP932 oracle
        run: cargo test -p zipcore --test golden -- --ignored --nocapture
      # Expand-Archive / tar / Shell.Application は windows-extract.ps1 内の
      # 補助レポート。失敗してもジョブは落とさない。
      # Expand-Archive が日本語を正しく展開した場合は bit 11 誤爆の疑い。

  tauri-sandbox:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            . -> target
            apps/winzip-jp/src-tauri -> apps/winzip-jp/src-tauri/target
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Test Tauri commands and sandbox policy
        run: cargo test -p winzip-jp
      - name: Test e2e-open probe (debug feature)
        run: cargo test -p winzip-jp --features e2e
      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile
      - name: Sandbox E2E (ad-hoc sign, --e2e-open, S1)
        run: bash apps/winzip-jp/scripts/sandbox-e2e.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sandbox-e2e
          path: |
            apps/winzip-jp/e2e/artifacts/s1-sandbox.png
            apps/winzip-jp/e2e/artifacts/sandbox-probe.json
            apps/winzip-jp/e2e/artifacts/signed-entitlements.xml
          if-no-files-found: error

  tauri-appstore-pkg:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            . -> target
            apps/winzip-jp/src-tauri -> apps/winzip-jp/src-tauri/target
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile
      - name: Plant quarantined dummy provision profile
        run: |
          set -euo pipefail
          dummy="${RUNNER_TEMP}/winzip-jp-dummy.provisionprofile"
          printf '%s\n' 'winzip-jp-ci-dummy-profile' > "$dummy"
          xattr -w com.apple.quarantine "0081;00000000;Safari;" "$dummy"
          xattr -p com.apple.quarantine "$dummy" >/dev/null
          echo "APPSTORE_PROVISION_PROFILE=${dummy}" >> "$GITHUB_ENV"
      - name: App Store bundle to .pkg (--no-upload)
        run: bash apps/winzip-jp/scripts/appstore-pkg.sh
      - name: Dummy profile in pkg must not carry quarantine
        run: |
          set -euo pipefail
          dest="${RUNNER_TEMP}/winzip-jp-pkg-assert"
          rm -rf "$dest"
          pkgutil --expand-full apps/winzip-jp/e2e/artifacts/winzip-jp.pkg "$dest"
          found=""
          while IFS= read -r f; do
            found="$f"
            break
          done < <(find "$dest" -name 'embedded.provisionprofile')
          if [[ -z "$found" ]]; then
            echo "embedded.provisionprofile が pkg にありません" >&2
            exit 1
          fi
          grep -Fq 'winzip-jp-ci-dummy-profile' "$found"
          if xattr -p com.apple.quarantine "$found" >/dev/null 2>&1; then
            echo "ダミープロファイルに com.apple.quarantine が残っています" >&2
            xattr -l "$found" >&2 || true
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: appstore-pkg
          path: apps/winzip-jp/e2e/artifacts/winzip-jp.pkg
          if-no-files-found: error

  ui-e2e:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            . -> target
            apps/winzip-jp/src-tauri -> apps/winzip-jp/src-tauri/target
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2
      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile
      - name: Check store listing copy
        run: node docs/store/check-listing.mjs
        env:
          STORE_LISTING_SKIP_SHOTS: "1"
      - name: Frontend unit tests
        run: pnpm --filter winzip-jp test
      - name: Production dist に E2E ハーネスが無い
        run: |
          pnpm --filter winzip-jp build
          if grep -R -E '__WINZIP_E2E__|e2e/harness|e2e/scenes' apps/winzip-jp/dist; then
            echo "本番 dist に E2E ハーネスがある"
            exit 1
          fi
      - name: Build frontend for E2E
        run: VITE_E2E=1 pnpm --filter winzip-jp build
      - name: WebdriverIO S1–S8 + pixelmatch
        run: pnpm --filter winzip-jp e2e
      - name: Store screenshots 2880x1800
        run: pnpm --filter winzip-jp store-screenshots
        env:
          STORE_SHOT_CHANNEL: chrome
      - name: Check store listing and screenshot sizes
        run: node docs/store/check-listing.mjs
      - name: Build Tauri debug app
        run: pnpm --filter winzip-jp build:debug
      - name: Capture debug app window
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p apps/winzip-jp/e2e/artifacts
          APP=$(find target apps/winzip-jp/src-tauri/target -name '*.app' -type d 2>/dev/null | head -1 || true)
          if [[ -z "${APP}" ]]; then
            APP=$(find . -name '*.app' -type d | head -1 || true)
          fi
          if [[ -z "${APP}" ]]; then
            echo "debug .app が見つかりません"
            exit 0
          fi
          echo "launching ${APP}"
          open "${APP}"
          sleep 6
          screencapture -x apps/winzip-jp/e2e/artifacts/s1-tauri-window.png || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: apps/winzip-jp/e2e/artifacts/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: store-screenshots
          path: docs/store/screenshots/*.png
          if-no-files-found: error
