[package]
name = "zipcore"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "CP932 向け ZIP のエンコーディング・作成・解凍・分割（PR 3 は解凍）"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
crc32fast = "1"
encoding_rs = "0.8"
flate2 = "1"
serde = { version = "1", features = ["derive"] }
unicode-normalization = "0.1"
unicode-segmentation = "1"
zip = { version = "9.0.3", default-features = false, features = ["deflate-flate2", "aes-crypto"] }

[dev-dependencies]
serde_json = "1"
